# Version updates weekly: minor and patch bumps grouped into one PR per
# ecosystem, each major bump its own PR so one breaking change can't block
# the rest. The cooldown matches [tool.uv] exclude-newer and .npmrc
# min-release-age; security updates ignore it.
#
# Dependabot updates uv.lock but not the requirements*.lock exports, so a
# uv PR fails the lint job until someone runs `uv run pre-commit run
# --all-files` on its branch and pushes the re-export.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
